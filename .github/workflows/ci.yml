name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.5"
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --frozen
      - run: bash scripts/check.sh
