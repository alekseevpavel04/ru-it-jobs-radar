[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "radar"
version = "0.1.0"
description = "Daily radar of Russian IT vacancies: collection, ClickHouse and dbt, LLM extraction, ML services"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "confluent-kafka==2.16.0",
    "datasketch==2.0.0",
    "dbt-clickhouse==1.10.3",
    "dbt-core==1.12.5",
    "fastapi==0.143.0",
    "httpx==0.28.1",
    "langgraph==1.2.14",
    "lifelines==0.30.3",
    "lxml==6.1.3",
    "matplotlib==3.11.2",
    "numpy==2.4.6",
    "pandas==2.3.3",
    "psutil==7.2.2",
    "pyarrow==25.0.1",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "redis==8.1.0",
    "scikit-learn==1.9.1",
    "sqlglot==30.21.0",
    "tzdata==2026.5",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "lxml-stubs==0.5.1",
    "mypy==2.4.0",
    "pandas-stubs==2.3.3.260113",
    "pyarrow-stubs==20.0.0.20260819",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "ruff==0.16.10",
    "types-psutil==7.2.2.20260906",
    "types-pyyaml==6.0.12.20260906",
]
dvc = [
    "dvc==3.67.1",
]
monitor = [
    "evidently==0.7.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Cyrillic letters in strings and comments are intended

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: needs Docker, GPU or a running stack"]
addopts = "-m 'not slow'"
