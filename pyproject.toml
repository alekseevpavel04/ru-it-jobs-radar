[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "radar"
version = "0.1.0"
description = "Daily radar of Russian IT vacancies: collection, ClickHouse and dbt, LLM extraction, ML services"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "httpx==0.28.1",
    "pyarrow==25.0.1",
    "pydantic==2.13.5",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Cyrillic letters in strings and comments are intended

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: needs Docker, GPU or a running stack"]
addopts = "-m 'not slow'"
