# Prometheus of the mlops profile. Targets are compose services on the project network;
# a target whose profile is down shows as down on the Targets page and in the dashboards.
global:
  scrape_interval: 30s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # FastAPI (radar.monitor.api_metrics): requests, latency, process memory.
  - job_name: api
    static_configs:
      - targets: [api:8000]

  # Airflow components and the radar_sla task over StatsD (orchestration profile).
  - job_name: airflow
    static_configs:
      - targets: [statsd-exporter:9102]

  # Freshness, extraction progress and ClickHouse internals (radar.monitor.exporter). Each scrape
  # runs aggregate queries, so once a minute is enough.
  - job_name: radar-data
    scrape_interval: 60s
    scrape_timeout: 30s
    static_configs:
      - targets: [radar-exporter:9188]

  # Redpanda's public endpoint on the admin port: topic offsets and the ClickHouse consumer group.
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: [redpanda:9644]
    metric_relabel_configs:
      # Per-client quota histograms: about 1 600 series nobody here reads.
      - source_labels: [__name__]
        regex: redpanda_kafka_quotas_.*
        action: drop
