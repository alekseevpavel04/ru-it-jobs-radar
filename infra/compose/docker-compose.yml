# The local stack. Profiles by layer; scripts/up.sh brings up all of them by default.
# Variables come from the repo-root .env (scripts/up.sh passes it with --env-file); a required
# variable that is empty stops `docker compose` before anything starts.
name: radar

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s
  start_interval: 2s

# llama-server runs on Windows (scripts/llm_server.sh) to keep the GPU outside the VM, so it is not
# a compose service. A service that calls the teacher merges this block.
x-llm-client: &llm-client
  extra_hosts:
    - host.docker.internal:host-gateway
  environment:
    LLM_BASE_URL: http://host.docker.internal:8080/v1

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  # Letters and digits only in AIRFLOW_DB_PASSWORD: it goes into this URI as is.
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-}@airflow-db:5432/airflow
  AIRFLOW__CORE__DAGS_FOLDER: /opt/radar/airflow/dags
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  AIRFLOW__CORE__PARALLELISM: "3"
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
  # One local account behind 127.0.0.1; FAB would add a Flask app and user tables for nothing.
  AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json
  # Signs the tokens tasks use against the execution API: must be the same in every component.
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-}
  AIRFLOW__API__WORKERS: "1"
  AIRFLOW__API__BASE_URL: http://localhost:8090
  # Metrics of every component and of the tasks (radar_sla) over StatsD to statsd-exporter. Tags
  # go in InfluxDB style (name,tag=value), which the exporter turns into Prometheus labels; the
  # legacy names, which put dag_id and task_id into the metric name, are off.
  AIRFLOW__METRICS__STATSD_ON: "true"
  AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
  AIRFLOW__METRICS__STATSD_PORT: "9125"
  AIRFLOW__METRICS__STATSD_PREFIX: airflow
  AIRFLOW__METRICS__STATSD_INFLUXDB_ENABLED: "true"
  AIRFLOW__METRICS__LEGACY_NAMES_ON: "false"

x-airflow: &airflow
  build:
    context: ../..
    dockerfile: airflow/Dockerfile
  image: radar/airflow:3.3.2
  profiles: [orchestration]
  # The host user (lib.sh sets AIRFLOW_UID), group root as the image expects: on a Windows drive
  # only the owner may set file times, which tar does when the sync unpacks partitions into data/raw.
  user: ${AIRFLOW_UID:?run through scripts/up.sh, which sets AIRFLOW_UID}:0
  restart: unless-stopped
  environment: *airflow-env
  volumes:
    - ../../airflow:/opt/radar/airflow:ro
    - airflow-logs:/opt/airflow/logs
  logging: *logging

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.20.9
    profiles: [core]
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set CLICKHOUSE_USER in .env}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
    ports:
      - 127.0.0.1:8123:8123
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    # The server sizes its memory pool from the cgroup limit (90% of it).
    mem_limit: 4g
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8123/ping"]
    logging: *logging

  # Databases of the storage layers and the analyst agent's read-only account. Runs on every `up`
  # and is idempotent, so a changed password in .env reaches the server without a volume reset.
  clickhouse-init:
    image: clickhouse/clickhouse-server:26.8.20.9
    profiles: [core]
    restart: "no"
    depends_on:
      clickhouse:
        condition: service_healthy
    entrypoint: ["bash", "/init/init.sh"]
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set CLICKHOUSE_USER in .env}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_RO_USER: ${CLICKHOUSE_RO_USER:?set CLICKHOUSE_RO_USER in .env}
      CLICKHOUSE_RO_PASSWORD: ${CLICKHOUSE_RO_PASSWORD:?set CLICKHOUSE_RO_PASSWORD in .env}
    volumes:
      - ../clickhouse:/init:ro
    mem_limit: 256m
    logging: *logging

  redpanda:
    image: redpandadata/redpanda:v26.2.4
    profiles: [core]
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --default-log-level=warn
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    ports:
      - 127.0.0.1:19092:19092
    mem_limit: 1536m
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
    logging: *logging

  redpanda-init:
    image: redpandadata/redpanda:v26.2.4
    profiles: [core]
    restart: "no"
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["bash", "/init/create-topics.sh"]
    environment:
      RPK_BROKERS: redpanda:9092
    volumes:
      - ./redpanda/create-topics.sh:/init/create-topics.sh:ro
    mem_limit: 256m
    logging: *logging

  console:
    image: redpandadata/console:v3.12.0
    profiles: [core]
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    ports:
      - 127.0.0.1:8081:8080
    mem_limit: 256m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/admin/health"]
    logging: *logging

  # Cache for the API: losing it costs recomputation only, so memory is capped and keys evicted by LRU.
  redis:
    image: redis:8.10.2-alpine
    profiles: [core]
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    ports:
      - 127.0.0.1:6379:6379
    mem_limit: 384m
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
    logging: *logging

  mlflow-db:
    image: postgres:18.6-alpine
    profiles: [ml]
    restart: unless-stopped
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_DB: mlflow
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD:?set MLFLOW_DB_PASSWORD in .env}
    volumes:
      # Postgres 18 keeps PGDATA in a versioned subdirectory of this path.
      - mlflow-db:/var/lib/postgresql
    mem_limit: 512m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "pg_isready", "--username=mlflow", "--dbname=mlflow"]
    logging: *logging

  mlflow:
    build: ./mlflow
    image: radar/mlflow:3.17.0
    profiles: [ml]
    restart: unless-stopped
    depends_on:
      mlflow-db:
        condition: service_healthy
    environment:
      # Server-side jobs serve the GenAI evaluation features and start seven worker processes
      # (about 1 GB); tracking runs and the model registry do not use them.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --workers=2
      - --backend-store-uri=postgresql+psycopg2://mlflow:${MLFLOW_DB_PASSWORD:?set MLFLOW_DB_PASSWORD in .env}@mlflow-db:5432/mlflow
      - --serve-artifacts
      - --artifacts-destination=/mlartifacts
      # Host header allowlist of the security middleware: the host side and other containers.
      - --allowed-hosts=localhost:5000,127.0.0.1:5000,mlflow:5000
    volumes:
      - mlflow-artifacts:/mlartifacts
    ports:
      - 127.0.0.1:5000:5000
    mem_limit: 1g
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
    logging: *logging

  # Airflow 3 with LocalExecutor: DAG tasks run as subprocesses of the scheduler, so the
  # scheduler carries the project mounts, the task environment and the memory for the tasks.
  # Its secrets use `:-` rather than `:?` because compose interpolates the whole file for every
  # profile; scripts/up.sh checks them when the orchestration profile is selected.
  airflow-db:
    image: postgres:18.6-alpine
    profiles: [orchestration]
    restart: unless-stopped
    entrypoint: ["bash", "/init/reapply-password.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_DB: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-}
    volumes:
      - airflow-db:/var/lib/postgresql
      - ./postgres/reapply-password.sh:/init/reapply-password.sh:ro
    mem_limit: 384m
    healthcheck:
      <<: *healthcheck
      # Over the network address with the password (loopback is trusted), so the service is healthy
      # only once the password from .env works.
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql --host=\"$$(hostname -i | cut -d' ' -f1)\" --username=airflow --dbname=airflow --no-psqlrc --quiet --command='SELECT 1' >/dev/null"]
    logging: *logging

  # Schema migration of the metadata database. Not an *-init service: the Airflow services wait for
  # it to finish inside `up`, so it runs before them on every start (a no-op when up to date).
  airflow-migrate:
    <<: *airflow
    restart: "no"
    depends_on:
      airflow-db:
        condition: service_healthy
    command: ["db", "migrate"]
    mem_limit: 1g

  airflow-api-server:
    <<: *airflow
    depends_on:
      airflow-migrate:
        condition: service_completed_successfully
      # The StatsD client resolves the host once; without it the process sends no metrics at all.
      statsd-exporter:
        condition: service_started
    command: ["bash", "/opt/radar/airflow/scripts/api-server.sh"]
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-}
    # 8080 is llama-server's, 8081 the Redpanda console's.
    ports:
      - 127.0.0.1:8090:8080
    mem_limit: 1g
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8080/api/v2/monitor/health"]

  airflow-scheduler:
    <<: *airflow
    depends_on:
      airflow-migrate:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy
      statsd-exporter:
        condition: service_started
    command: ["scheduler"]
    environment:
      <<: *airflow-env
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
      # The task environment: the core stack by its service names, the raw layer as mounted below.
      RADAR_DATA_DIR: /opt/radar/data
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set CLICKHOUSE_USER in .env}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      REDPANDA_BROKERS: redpanda:9092
      PYTHONDONTWRITEBYTECODE: "1"
      # Standard-library helpers the Python tasks import under Airflow's interpreter (raw_layer,
      # dbt_handover); the project's code runs under /opt/radar/.venv instead.
      PYTHONPATH: /opt/radar/airflow/include
    volumes:
      - ../../airflow:/opt/radar/airflow:ro
      - ../../src:/opt/radar/src:ro
      - ../../scripts:/opt/radar/scripts:ro
      - ../../dbt:/opt/radar/dbt:ro
      - airflow-dbt-target:/opt/radar/dbt/target
      - airflow-dbt-logs:/opt/radar/dbt/logs
      # Written by the sync from the collection server; assumes RADAR_DATA_DIR=data on the host.
      - ../../data/raw:/opt/radar/data/raw
      # The host user's ssh directory for the sync (set by lib.sh); keys are copied into the tmpfs.
      - ${RADAR_SSH_DIR:?run through scripts/up.sh, which sets RADAR_SSH_DIR}:/run/host-ssh:ro
      - airflow-logs:/opt/airflow/logs
    tmpfs:
      - /home/airflow/.ssh:mode=0700,uid=${AIRFLOW_UID:?run through scripts/up.sh, which sets AIRFLOW_UID},gid=0
    mem_limit: 2g
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8974/health"]

  airflow-dag-processor:
    <<: *airflow
    depends_on:
      airflow-migrate:
        condition: service_completed_successfully
      statsd-exporter:
        condition: service_started
    command: ["dag-processor"]
    mem_limit: 768m
    healthcheck:
      <<: *healthcheck
      interval: 60s
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --local"]

  # StatsD in, Prometheus format out (:9102/metrics) for the Airflow services, ready for the
  # Prometheus of the mlops profile. Holds only current values, so it needs no volume.
  statsd-exporter:
    image: prom/statsd-exporter:v0.31.0
    profiles: [orchestration]
    restart: unless-stopped
    ports:
      - 127.0.0.1:9102:9102
    mem_limit: 64m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9102/metrics"]
    logging: *logging

  # The weekly market digest. The workflow is code in infra/n8n/workflows and gets into
  # the instance with scripts/n8n_import.sh, which also sets up the owner account and the read-only
  # ClickHouse credential; it starts this service alone (`up n8n`), not the rest of the profile.
  n8n:
    build: ../n8n
    image: radar/n8n:2.41.3
    profiles: [mlops]
    restart: unless-stopped
    environment:
      GENERIC_TIMEZONE: Europe/Moscow
      TZ: Europe/Moscow
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_EDITOR_BASE_URL: http://localhost:5678
      # Plain HTTP behind 127.0.0.1: a secure-only cookie would never be sent back and login would loop.
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # n8n 2 leaves Execute Command out by default; the digest runs the tested Python module with it.
      NODES_EXCLUDE: '["n8n-nodes-base.localFileTrigger"]'
      # File nodes may touch this directory only: the bundle of query results lives there for a run.
      N8N_RESTRICT_FILE_ACCESS_TO: /home/node/.n8n-files
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "720"
      PYTHONPATH: /opt/radar/src
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - n8n-data:/home/node/.n8n
      - ../../src:/opt/radar/src:ro
      - ../../site/src/digest:/opt/radar/site/src/digest
      - ../n8n/workflows:/opt/radar/infra/n8n/workflows:ro
    tmpfs:
      - /home/node/.n8n-files:mode=0700,uid=1000,gid=1000
    ports:
      - 127.0.0.1:5678:5678
    mem_limit: 1g
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5678/healthz"]
    logging: *logging

volumes:
  clickhouse-data:
  redpanda-data:
  redis-data:
  mlflow-db:
  mlflow-artifacts:
  airflow-db:
  airflow-logs:
  airflow-dbt-target:
  airflow-dbt-logs:
  n8n-data:
