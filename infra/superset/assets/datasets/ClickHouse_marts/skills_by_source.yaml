table_name: skills_by_source
main_dttm_col: null
description: 'Навык x источник за весь период сбора (Telegram: последние 100 дней), знаменатель из mart_junior.'
default_endpoint: null
offset: 0
cache_timeout: null
catalog: null
schema: marts
sql: |
  SELECT
      s.source AS source,
      s.skill AS skill,
      s.skill_category AS skill_category,
      sum(s.vacancies_mentioning) AS vacancies_mentioning,
      any(t.vacancies) AS vacancies_total
  FROM marts.mart_skills AS s
  -- mart_skills has rows only for cells with a mention, so the source total comes from mart_junior,
  -- which counts the same vacancies (Telegram: the same last 100 days) per source and role bucket.
  INNER JOIN (SELECT source, sum(vacancies) AS vacancies FROM marts.mart_junior GROUP BY source) AS t
      ON s.source = t.source
  GROUP BY s.source, s.skill, s.skill_category
