    id: MARKDOWN-lifetime-1-1
    meta:
      code: '**Срез рынка без hh.ru.** Источники: открытые данные портала «Работа в России» (trudvsem), Хабр Карьера
        и публичные Telegram-каналы. Крупнейшая площадка hh.ru не собирается, поэтому это не весь рынок IT-вакансий
        России. Источники считаются отдельно и не складываются. Дата обновления: последний собранный день каждого
        источника в таблице справа.


        Вакансия закрыта, когда пропала из источника: из снимков портала на 7 дней, с Хабр Карьеры на 3 полных дня
        сбора. Квантили считаются только по наблюдавшимся закрытиям вакансий, появившихся после первого дня сбора;
        ещё открытые не учтены, поэтому квантили смещены к коротким срокам и не являются оценкой выживаемости. Оценка
        Каплана-Мейера с учётом цензурирования в results/models/survival.json.'
