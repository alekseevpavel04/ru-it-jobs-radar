    meta:
      code: '**Срез рынка без hh.ru.** Источники: открытые данные портала «Работа в России» (trudvsem), Хабр Карьера
        и публичные Telegram-каналы. Крупнейшая площадка hh.ru не собирается, поэтому это не весь рынок IT-вакансий
        России. Источники считаются отдельно и не складываются. Дата обновления: последний собранный день каждого
        источника в таблице справа.


        Навык засчитан, если словарь (версия v0) нашёл его в названии, тексте или тегах вакансии. У коротких написаний
