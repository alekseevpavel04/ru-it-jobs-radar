    id: MARKDOWN-market-1-1
    meta:
      code: '**Срез рынка без hh.ru.** Источники: открытые данные портала «Работа в России» (trudvsem), Хабр Карьера
        и публичные Telegram-каналы. Крупнейшая площадка hh.ru не собирается, поэтому это не весь рынок IT-вакансий
        России. Источники считаются отдельно и не складываются. Дата обновления: последний собранный день каждого
        источника в таблице справа.


        Вакансия считается один раз внутри источника (дедуп сущностей). Снимки портала и API «Работы в России» это
        разные инструменты одного портала, их ряды не складываются. Хабр Карьера и API собираются недавно, поэтому
        у них пока одна неделя. Закрытие подтверждается через 7 дней отсутствия в снимках, поэтому на графике новых
        и закрытых нет последней недели и первой недели сбора. В Telegram считаются посты, а не вакансии.'
      height: 30
      width: 8
