# Control set of the analyst agent: a question in Russian and the reference SQL over the
# marts. Answers are never typed here: `python -m radar.agent build` runs every query on the frozen
# snapshot (eval/agent/snapshot.json) and writes eval/agent/control_set.jsonl with the split.
#
# A reference query returns only the columns that answer the question; the agent may return more
# (radar.agent.compare). Questions name the source, since the sources are separate instruments.

seed = 20261011
dev_share = 0.4

# ---------------------------------------------------------------- counts

[[question]]
id = "count_01"
kind = "count"
question = "Сколько вакансий ML и Data Science на Хабр Карьере?"
