    "rhcsa", "rhce", "aws certified", "оксм", "окпд",
]
# Whole-string regexes on the lowercased name.
patterns = [
    '\d+-фз',
    'английск[а-я]*(?: язык[а-я]*)?(?: (?:a|b|c)[12]| intermediate| upper[- ]intermediate)?',
    '(?:pre-|upper[- ])?intermediate|[abc][12]',
]

[search]
# Canonical spellings the rule baseline does not look for in texts by themselves, because the bare
# spelling is a letter, an ordinary word or another product's name ("Смета", "Pax", "C" in
# "c 9:00", "Flux" the CD tool and "Flux" the image model). Their aliases are still searched.
names_not_searched = [
    "C", "R", "ST", "LD", "LAD", "os", "Make", "Access", "Word", "sparse", "Trinity", "typing",
    "datetime", "requests", "namespaces", "perf", "Datasets", "Lightning", "Boost", "Flux", "Pax",
    "ADS", "MIG", "MPS", "EPC", "T5", "C4 model", "А0", "Смета", "Рубеж", "Болид", "Парус",
    "Галактика", "Континент", "Telegram", "LinkedIn", "Wildberries", "Ozon", "Игромир", "Transformer",
    "Service Manager", "УАТ", "S4", "SDI",
]
# In an English text these spellings count only when not written in lowercase: "Go" and "REST"
# are skills, "go" and "the rest" are not.
english_words = [
    "go", "rest", "less", "solid", "chef", "node", "gin", "spring", "swift", "rust", "dart", "julia",
    "ci", "yarn", "hive", "triton", "astra", "arm", "can", "vault", "consul", "kong", "loki", "nexus",
