    "rabbit", "kali", "cursor",
]

[review]
# Settings of `python -m radar.extract.skill_review`. A train_pool spelling is proposed when it is
# seen in at least `floor` records; `model` and `threshold` come from `select`
# (results/skills/proposal_models.json): the threshold keeps the nearest-neighbour alias right in at
# least `min_precision` of the dictionary's own aliases above it.
floor = 10
# The model that keeps the most of the dictionary's aliases above its threshold
# (results/skills/proposal_models.json). e5-large is right more often at top 1, but its cosines are
# compressed and few aliases clear the bar. On real train_pool candidates most alias proposals were
# wrong (alias_proposals_accepted in results/skills/normalization.json): read them, never apply them.
model = "ai-forever/FRIDA"
threshold = 0.8877
min_precision = 0.9
