# Skill dictionary v1 (E2 in docs/EXPERIMENTS.md): canonical names of the `skills` field, their spellings, and what
# the annotation guide does not count as a skill. Read by `radar.extract.skills` (normalization of
# any system's output and of the eval comparison) and by `radar.extract.skill_dictionary` (the
# search in texts of the rule baseline). The dbt seed `dbt/seeds/skill_dictionary.csv` is v0 and
# stays as it is until the marts switch.
#
# Where the entries come from: the v0 seed (its merged groups split where the gold keeps the parts
# apart: Ubuntu is not Linux, HDFS is not Hadoop), the skill names of the gold labels on dev and
# test (names only, as a vocabulary of spellings), and frequent unknown spellings in train_pool texts
# reviewed by hand (`python -m radar.extract.skill_review`, decisions in [review]).
#
# Canonical spelling (docs/annotation_guide.md, skills and cases 21, 25, 35, 48, 53-62, 74): the
# official product name without vendor prefix (Kafka, not Apache Kafka; Excel, not Microsoft Excel),
# without version or edition (Python, not Python 3.10; .NET, not .NET Core), 1С with the Cyrillic С,
# 1С configurations as "1С:<short name>". Spellings that differ only in case, spaces, dots or hyphens
# need no alias: the lookup ignores them.
#
# [skills.<category>]: "Canonical" = [aliases]. An alias is a fixed spelling, matched whole.
# [patterns]: regexes for inflected Russian spellings, matched whole against the lowercased string
#   (ё as е) and searched in texts by the baseline.
# [parents]: a broader skill the marts may roll a name up to (Ubuntu to Linux). Not used in scoring.
# [non_skills]: what the guide says is not a skill; normalization maps these to None.
# [search]: what the baseline does not search for in texts (see there).
# [review]: train_pool candidates looked at and left out.

