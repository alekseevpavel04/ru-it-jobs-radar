# Public Telegram channels collected through t.me/s/<name> for weekly site aggregates and the
# extraction corpus (DECISIONS 10; texts are never published). Survey of 2026-10-08; numbers per
# channel are in results/sources/telegram_channels.json, method in docs/sources.md (Telegram, 1.5).
#
# A channel is enabled when its last post is at most 30 days old, at least 15 of its last 50 posts
# carry a vacancy (rules, and the manual check where one was made), at least 30% of its text posts are
# in Russian, the topic is IT and it is not a copy of another enabled channel. `exception` records why
# a channel stays enabled although it fails a criterion; `backfill = false` marks a channel that keeps
# only recent posts, so it is collected daily and never backfilled.
#
# `lang` keeps a channel to one language downstream: only posts whose own text (links, hashtags and
# @names cut) is in it count in stg_telegram and enter the Telegram corpus; the raw layer keeps every
# post. Rule and counts: radar.extract.telegram_corpus.post_lang, results/corpus/telegram_lang.json.
#
# `network` groups channels of one publisher: their posts overlap, so cross-channel dedup is required
# (the same goes for habr_career and progjob against the Habr Career source).

