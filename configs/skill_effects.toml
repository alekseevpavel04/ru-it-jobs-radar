# Settings for `python -m radar.models.skill_effects`. Changing any value changes every
# reported number: record the change in docs/EXPERIMENTS.md.

[data]
# The salary frame (radar.models.salary) and the skill extractor whose skills are the treatments.
# student: skills as the fine-tuned extractor read them from the whole text, not only the dictionary hits.
feature_set = "student"
# Test rows of the salary split stay untouched, so the salary test remains a test.
splits = ["train", "calib", "dev"]
# A skill is a treatment when at least this many vacancies have it and at least this many do not.
min_rows = 100

[model]
n_folds = 5
n_rep = 1
seed = 20261008
# Nuisance learners: E[log salary | X, other skills] and P(skill | X, other skills), both boosting.
max_iter = 300
learning_rate = 0.1
max_leaf_nodes = 15
min_samples_leaf = 20

[inference]
level = 0.95
# Sensitivity to an unobserved confounder (Chernozhukov et al. 2022): the share of residual variance of
# the outcome (cf_y) and of the treatment (cf_d) it would explain. 0.03 is the DoubleML default scenario.
cf_y = 0.03
cf_d = 0.03
