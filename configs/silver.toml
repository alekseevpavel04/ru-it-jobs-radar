# Silver labels for the student (`python -m radar.extract.silver`).
#
# A composition names the source of each schema field: "rules" (the regex baseline on the same
# input), "qwen" or "yandex" (that teacher's answer), "agree" (the teachers' value where
# both answered and agree, the rules' value otherwise). A field not listed comes from the rules.
#
# Each source family compares its candidates on its own dev split (`dev --family F`): trudvsem_habr
# on dev, telegram on tg_dev, and chooses one of them. `build` writes every family that has a choice
# and skips the rest. Candidates are fixed before their dev scores are seen, at most four per family.
# Changing a choice or a composition changes the training set: record it in docs/EXPERIMENTS.md.

[candidates]
trudvsem_habr = ["rules", "qwen_role_format", "agree_role_format", "qwen_role"]
# A post has no header: the rules read salary, cities and experience from free text, where they are
# weakest, so a teacher may win more fields than on trudvsem and Habr.
telegram = ["rules", "qwen_role_format", "qwen_all", "agree_all"]

[chosen]
# Every candidate stays within 0.01 macro F1 of the rules on dev (results/extract/dev_silver_*_vs_regex.json),
# and a gain below 0.01 does not count (stop rule of EXPERIMENTS.md): the simplest composition wins.
trudvsem_habr = "rules"
# agree_all minus qwen_all on tg_dev: +0.014 macro F1 (results/extract/tg_dev_silver_agree_all_vs_silver_qwen_all.json), above the
# 0.01 threshold; skills gain most, where the rules stand in when the teachers disagree.
telegram = "agree_all"

# A rules-only composition needs no teacher: its records are a stratified sample of the family's
# current training pool, drawn as the teacher labeling drew the teachers' sample (every ML/DS/data vacancy, the
# rest proportional to source x role proxy). The labels then follow the current versions of the
# vacancies after a corpus rebuild.
[rules_sample.trudvsem_habr]
limit = 6000
keep_all = ["ml_ds_data"]

[compositions.rules]

# The teachers' only dev gains over the rules are role and work_format (results/extract/dev_*.json).
[compositions.qwen_role_format]
role = "qwen"
work_format = "qwen"

[compositions.agree_role_format]
role = "agree"
work_format = "agree"

# Role alone: its dev gain is the larger one, work_format F1 rises while its accuracy drops.
[compositions.qwen_role]
role = "qwen"

[compositions.qwen_all]
role = "qwen"
grade = "qwen"
skills = "qwen"
salary = "qwen"
work_format = "qwen"
cities = "qwen"
experience_years = "qwen"
employment_type = "qwen"
lang = "qwen"

[compositions.agree_all]
role = "agree"
grade = "agree"
skills = "agree"
salary = "agree"
work_format = "agree"
cities = "agree"
experience_years = "agree"
employment_type = "agree"
lang = "agree"
