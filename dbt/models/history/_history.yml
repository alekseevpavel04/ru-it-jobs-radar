  # Snapshot days 07-01..07-05, a hole, 07-20..07-22; the calendar is that of a grace of 2 days.
  #   g_back       missing 07-03 only, back 07-04 and after the hole: one open version
  #   g_gone       missing 07-03 and 07-04: closed 07-03
  #   hidden_back  unpublished on 07-02, open again 07-03, then gone: one version, closed 07-04
  #   gap_back     last seen 07-05, back 07-21 after the hole and one missing day: one open version
  #   gap_gone     last seen 07-05, missing 07-20 and 07-21: closed in the gap, first known 07-20
  - name: hist_vacancy_scd2_grace_and_gaps
    description: A return within the grace window keeps the version; a closure across a hole is closed_in_gap.
    model: hist_vacancy_scd2
    given:
      - input: ref('hist_observations')
        rows:
          - {source: trudvsem_snapshot, source_id: g_back, dt: 2026-07-01, content_hash: b1}
          - {source: trudvsem_snapshot, source_id: g_back, dt: 2026-07-02, content_hash: b1}
          - {source: trudvsem_snapshot, source_id: g_back, dt: 2026-07-04, content_hash: b1}
          - {source: trudvsem_snapshot, source_id: g_back, dt: 2026-07-05, content_hash: b1}
          - {source: trudvsem_snapshot, source_id: g_back, dt: 2026-07-20, content_hash: b1}
          - {source: trudvsem_snapshot, source_id: g_back, dt: 2026-07-21, content_hash: b1}
          - {source: trudvsem_snapshot, source_id: g_back, dt: 2026-07-22, content_hash: b1}
          - {source: trudvsem_snapshot, source_id: g_gone, dt: 2026-07-01, content_hash: o1}
          - {source: trudvsem_snapshot, source_id: g_gone, dt: 2026-07-02, content_hash: o1}
          - {source: trudvsem_snapshot, source_id: hidden_back, dt: 2026-07-01, content_hash: u1}
          - {source: trudvsem_snapshot, source_id: hidden_back, dt: 2026-07-02, content_hash: u2, is_closed_state: true}
          - {source: trudvsem_snapshot, source_id: hidden_back, dt: 2026-07-03, content_hash: u1}
          - {source: trudvsem_snapshot, source_id: gap_back, dt: 2026-07-04, content_hash: k1}
          - {source: trudvsem_snapshot, source_id: gap_back, dt: 2026-07-05, content_hash: k1}
          - {source: trudvsem_snapshot, source_id: gap_back, dt: 2026-07-21, content_hash: k1}
          - {source: trudvsem_snapshot, source_id: gap_back, dt: 2026-07-22, content_hash: k1}
          - {source: trudvsem_snapshot, source_id: gap_gone, dt: 2026-07-04, content_hash: z1}
          - {source: trudvsem_snapshot, source_id: gap_gone, dt: 2026-07-05, content_hash: z1}
      - input: ref('hist_calendar')
        rows:
          - {source: trudvsem_snapshot, dt: 2026-07-01, next_complete_dt: 2026-07-02, closure_confirmed_dt: 2026-07-03}
          - {source: trudvsem_snapshot, dt: 2026-07-02, next_complete_dt: 2026-07-03, closure_confirmed_dt: 2026-07-04}
          - {source: trudvsem_snapshot, dt: 2026-07-03, next_complete_dt: 2026-07-04, closure_confirmed_dt: 2026-07-05}
          - {source: trudvsem_snapshot, dt: 2026-07-04, next_complete_dt: 2026-07-05, closure_confirmed_dt: 2026-07-20}
          - {source: trudvsem_snapshot, dt: 2026-07-05, next_complete_dt: 2026-07-20, closure_confirmed_dt: 2026-07-21}
          - {source: trudvsem_snapshot, dt: 2026-07-20, next_complete_dt: 2026-07-21, closure_confirmed_dt: 2026-07-22}
          - {source: trudvsem_snapshot, dt: 2026-07-21, next_complete_dt: 2026-07-22, closure_confirmed_dt: null}
          - {source: trudvsem_snapshot, dt: 2026-07-22, next_complete_dt: null, closure_confirmed_dt: null}
    expect:
      rows:
        - {source: trudvsem_snapshot, source_id: g_back, version_no: 1, valid_from: 2026-07-01, valid_to: null, is_current: true, change_reason: new, ended_by: null, closed_in_gap: false, last_seen: 2026-07-22, days_seen: 7}
        - {source: trudvsem_snapshot, source_id: g_gone, version_no: 1, valid_from: 2026-07-01, valid_to: 2026-07-03, is_current: false, change_reason: new, ended_by: closed, closed_in_gap: false, last_seen: 2026-07-02, days_seen: 2}
        - {source: trudvsem_snapshot, source_id: hidden_back, version_no: 1, valid_from: 2026-07-01, valid_to: 2026-07-04, is_current: false, change_reason: new, ended_by: closed, closed_in_gap: false, last_seen: 2026-07-03, days_seen: 2}
        - {source: trudvsem_snapshot, source_id: gap_back, version_no: 1, valid_from: 2026-07-04, valid_to: null, is_current: true, change_reason: new, ended_by: null, closed_in_gap: false, last_seen: 2026-07-22, days_seen: 4}
        - {source: trudvsem_snapshot, source_id: gap_gone, version_no: 1, valid_from: 2026-07-04, valid_to: 2026-07-20, is_current: false, change_reason: new, ended_by: closed, closed_in_gap: true, last_seen: 2026-07-05, days_seen: 2}

  # Pairs with distinct text so that only the intended ones match.
  #   old_a -> new_a      gap 2: a repost
  #   old_b -> new_b      another region: no pair
  #   old_c -> new_c      gap 23: a candidate outside the 14-day window
  #   old_e1, old_e2 -> new_e   one successor, the later closure keeps it
  #   old_d (open) -> new_d     the old one never closed: no pair
  #   ip_old -> ip_new    employer is a bare sole proprietor (no key): no pair
  - name: hist_reposts_pairs
    description: Same employer, region, title and text under a new id after the old one closed.
    model: hist_reposts
    given:
      - input: ref('hist_vacancy_scd2')
        rows:
          - {source: trudvsem_snapshot, source_id: old_a, version_no: 1, valid_from: 2026-07-01, valid_to: 2026-07-04, is_current: false, last_seen: 2026-07-03, employer_key: inn1, location_key: Москва, title_norm: python разработчик, text_hash: 1}
