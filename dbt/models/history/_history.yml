          - {source: trudvsem_snapshot, source_id: old_c, version_no: 1, valid_from: 2026-07-01, valid_to: 2026-07-02, is_current: false, last_seen: 2026-07-01, employer_key: inn2, location_key: Москва, title_norm: аналитик данных, text_hash: 3}
          - {source: trudvsem_snapshot, source_id: new_c, version_no: 1, valid_from: 2026-07-25, is_current: true, last_seen: 2026-07-26, employer_key: inn2, location_key: Москва, title_norm: аналитик данных, text_hash: 3}
          - {source: trudvsem_snapshot, source_id: old_e1, version_no: 1, valid_from: 2026-07-01, valid_to: 2026-07-04, is_current: false, last_seen: 2026-07-03, employer_key: inn3, location_key: Москва, title_norm: devops инженер, text_hash: 5}
          - {source: trudvsem_snapshot, source_id: old_e2, version_no: 1, valid_from: 2026-07-02, valid_to: 2026-07-05, is_current: false, last_seen: 2026-07-04, employer_key: inn3, location_key: Москва, title_norm: devops инженер, text_hash: 5}
          - {source: trudvsem_snapshot, source_id: new_e, version_no: 1, valid_from: 2026-07-06, is_current: true, last_seen: 2026-07-08, employer_key: inn3, location_key: Москва, title_norm: devops инженер, text_hash: 5}
          - {source: trudvsem_snapshot, source_id: old_d, version_no: 1, valid_from: 2026-07-01, is_current: true, last_seen: 2026-07-08, employer_key: inn4, location_key: Москва, title_norm: программист 1с, text_hash: 6}
          - {source: trudvsem_snapshot, source_id: new_d, version_no: 1, valid_from: 2026-07-05, is_current: true, last_seen: 2026-07-08, employer_key: inn4, location_key: Москва, title_norm: программист 1с, text_hash: 6}
          - {source: trudvsem_snapshot, source_id: ip_old, version_no: 1, valid_from: 2026-07-01, valid_to: 2026-07-03, is_current: false, last_seen: 2026-07-02, employer_key: null, location_key: Москва, title_norm: верстальщик, text_hash: 7}
