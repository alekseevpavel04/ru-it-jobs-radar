version: 2

# One physical table, raw.vacancies (infra/clickhouse/001_raw_vacancies.sql), declared once per
# source so that each gets its own freshness check and lineage. Read it with FINAL: a replay
# delivers rows again and the ReplacingMergeTree folds them only on merge.
sources:
  - name: raw
    database: raw
    schema: raw
    description: >
      Raw layer streamed from Redpanda. One row is one record of one raw partition dt;
      the same vacancy seen on ten days is ten rows. Personal data are removed before the raw layer
      (DECISIONS 3).
    loaded_at_field: fetched_at
    tables:
      - name: trudvsem
        identifier: vacancies
        description: Daily IT slice of the trudvsem open-data API; dt is the Moscow day of the run.
        config:
          freshness:
            warn_after: {count: 26, period: hour}
            error_after: {count: 50, period: hour}
            filter: "source = 'trudvsem'"
      - name: trudvsem_snapshot
        identifier: vacancies
        description: >
          Daily XML snapshots of the whole trudvsem set (all professions); dt is the snapshot date,
          fetched_at the moment the backfill downloaded it. A snapshot is published about 13:50
          Moscow time and takes hours to download and parse, hence the looser threshold.
        config:
          freshness:
            warn_after: {count: 48, period: hour}
            error_after: {count: 96, period: hour}
            filter: "source = 'trudvsem_snapshot'"
      - name: habr
        identifier: vacancies
        description: >
          Daily snapshot of the Habr Career list plus card pages of new and changed vacancies;
          dt is the Moscow day of the run.
        config:
          freshness:
            warn_after: {count: 26, period: hour}
            error_after: {count: 50, period: hour}
            filter: "source = 'habr'"
      - name: telegram
        identifier: vacancies
        description: >
          Posts of the public Telegram channels of configs/telegram_channels.toml read through
          t.me/s/ (DECISIONS 10: weekly aggregates only); dt is the Moscow day of the run, not of
          the post. is_vacancy and multi_vacancy come from the rules of radar.collect.telegram_rules.
        config:
          freshness:
            warn_after: {count: 26, period: hour}
            error_after: {count: 50, period: hour}
            filter: "source = 'telegram'"

  - name: dedup
    database: staging
    schema: staging
    description: >
      Tables written by Python steps of the pipeline rather than by dbt.
    tables:
      - name: vacancy_entities
        description: >
          Cross-source dedup entities, written by `python -m radar.dedup link` over the IT
          units of stg_trudvsem_api, stg_trudvsem_snapshot and stg_habr as staged when it ran. One
          row per (source, source_id). Records staged after that run have no row yet; the marts then
          fall back to the record's own id (int_vacancy_records).
        columns:
          - name: source
            description: trudvsem, trudvsem_snapshot or habr.
          - name: source_id
            description: Vacancy id at the source; the API and the snapshots share ids.
          - name: vacancy_entity_id
            description: One vacancy across records and sources (connected component of the dedup rule).
          - name: text_cluster_id
            description: Near-identical text regardless of place and employer; the unit of the gold split.
