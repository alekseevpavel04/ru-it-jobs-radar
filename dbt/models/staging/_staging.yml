version: 2

# Enumerations: a new currency fails the build (it would silently skew salary numbers); a new value
# in a descriptive field only warns, so the daily load is not stopped by the portal adding a
# schedule type. Value lists come from the data of 2026-06-30..2026-07-03 (snapshot) and
# 2026-10-08 (API, Habr).

models:
  - name: stg_trudvsem_api
    description: >
      trudvsem open-data API, one row per vacancy per raw day (source_id, dt): the latest fetched_at
      of that day. Typed fields from the payload; amounts and currency as the source states them,
      parsing of free-text salaries is left to radar.extract. Built one day at a time
      (materialization incremental_by_day). The collected slice is wide on purpose (IT sphere plus
      role text queries), so it carries the same is_it_candidate flag as the snapshot.
    data_tests:
      - unique_combination:
          arguments:
            columns: [source_id, dt]
    columns:
      - name: source
        description: Always trudvsem here.
        data_tests: [not_null]
      - name: source_id
        description: Vacancy id at the source (UUID).
        data_tests: [not_null]
      - name: dt
        description: Raw partition date; for the API the Moscow day of the run.
        data_tests: [not_null]
      - name: content_hash
        description: Hash of what the record says; with source, source_id and dt it is the key of the raw row.
        data_tests: [not_null]
      - name: fetched_at
        description: When the record was requested (UTC).
        data_tests: [not_null]
      - name: published_at
        description: Creation date at the source (creation-date / creationDate), UTC.
      - name: modified_at
        description: Last modification at the source (date_modify / dateModify), UTC.
      - name: url
        description: Vacancy page; null for sole proprietors, whose link carries the OGRNIP (DECISIONS, ИП).
      - name: title
        description: Job title.
        data_tests: [not_null]
      - name: text
        description: Duties, requirements and conditions as labelled sections, after PII removal.
      - name: has_text
        description: text is present and not blank.
        data_tests: [not_null]
      - name: employer_name
        description: Employer as named by the source; "ИП" for a sole proprietor, the name being personal data.
      - name: employer_inn
        description: Employer INN; removed for sole proprietors by the raw cleaner.
      - name: region
        description: Region name.
      - name: region_code
        description: Region code of the portal (13 digits).
      - name: address
        description: Workplace address as stated (first address for the API).
      - name: salary_text
        description: Salary as the portal prints it; always "от N" in the data seen, so it does not tell whether salary_to was stated.
      - name: salary_from
        description: salaryMin / salary_min; null when absent or 0, which the portal uses for "not stated".
      - name: salary_to
        description: >
          salaryMax / salary_max; null when absent or 0. Equals salary_from on many records (3 921
          of 11 632 in the API on 2026-10-08), which may mean a fixed amount or an unstated maximum.
      - name: salary_currency
        description: Currency as the source writes it.
      - name: salary_currency_code
        description: ISO code of the currency (RUB, USD, EUR, ...), null when no amount or currency.
      - name: schedule
        description: Working schedule (portal dictionary).
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Полный рабочий день
                  - Неполный рабочий день/неполная рабочая неделя
                  - Сменная работа
                  - Ненормированный рабочий день
                  - Режим гибкого рабочего времени
                  - Вахтовый метод
              config:
                severity: warn
      - name: employment
        description: Employment type (portal dictionary); empty in the source becomes null.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Полная занятость
                  - Частичная занятость
                  - Временная работа
                  - Сезонная работа
                  - Стажировка
                  - Дистанционная (удаленная) работа
              config:
                severity: warn
      - name: experience_min_years
        description: Required years of experience as stated (a minimum).
      - name: education
        description: Required education (portal dictionary).
      - name: sphere_name
        description: Professional sphere name.
      - name: profession_code
        description: Profession code of the portal classifier; one typical position spans many codes.
      - name: typical_position
        description: Typical position of the portal's profession classifier.
      - name: source_type
        description: >
          Who posted it. "Вакансия интернет ресурса" are reposts from commercial sites (rabota.ru);
          their text is not to be published (DECISIONS, proposal).
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Вакансия работодателя
                  - Вакансия интернет ресурса
                  - Вакансия кадрового агентства
                  - Цифровой хаб
                  - Аккредитованное частное агентство занятости
              config:
                severity: warn
      - name: skills
        description: Skills listed by the employer.
      - name: is_it_candidate
        description: &it_rule >
          Wide IT filter, not measured yet: true when the professional sphere is
          InformationTechnology (API: its name), or the typical position is in the seed
          it_typical_positions, or the lowercased title matches the pattern of macro
          it_title_pattern (programmer, developer, analyst of data, DevOps, QA, sysadmin,
          information security, language and stack names, IT as a word, and similar). It is meant
          to keep recall high; the sphere alone is noisy (58 of 200 IT-like titles) and misses most
          programmers (37 of 100), see docs/sources.md. Precision and recall are to be measured on
          labelled data before the filter is narrowed.
        data_tests: [not_null]
      - name: ingested_at
        description: When the chosen raw row reached ClickHouse; drives which days a build takes again.
        data_tests: [not_null]
      - name: is_hr_agency
        description: Employer flagged by the API as a recruitment agency.
      - name: collector_queries
        description: Which collector queries (IT sphere, role text searches) returned the record.

  - name: stg_trudvsem_snapshot
    description: >
      Daily XML snapshots of the whole trudvsem set, all professions, one row per vacancy per
      snapshot date (source_id, dt). Filter IT with is_it_candidate. About 550k rows per day and
      about 100 days, so it is a table partitioned by dt and built one day per statement
      (materialization incremental_by_day): a single statement over all days does not fit the
      server's memory.
    data_tests:
      - unique_combination:
          arguments:
            columns: [source_id, dt]
    columns:
      - name: source
        description: Always trudvsem_snapshot here.
        data_tests: [not_null]
      - name: source_id
        description: Vacancy id at the source (UUID).
        data_tests: [not_null]
      - name: dt
        description: Snapshot date (not the date it was downloaded).
        data_tests: [not_null]
      - name: content_hash
        description: Hash of what the record says; with source, source_id and dt it is the key of the raw row.
        data_tests: [not_null]
      - name: fetched_at
        description: When the backfill downloaded the snapshot (UTC).
        data_tests: [not_null]
      - name: published_at
        description: creationDate, UTC.
      - name: modified_at
        description: dateModify, UTC.
      - name: url
        description: Vacancy page; null for sole proprietors.
      - name: title
        description: vacancyName.
        data_tests: [not_null]
      - name: text
        description: >
          Free-text sections (duties, requirements, conditions) after PII removal, for IT candidates
          only; null for other professions (about 98% of rows), whose text stays in raw.vacancies
          under (source, source_id, dt, content_hash). has_text tells whether the source had text.
      - name: has_text
        description: The source record has non-blank text (also where text is not kept).
        data_tests: [not_null]
      - name: employer_name
        description: fullCompanyName; "ИП" for a sole proprietor.
      - name: employer_inn
        description: Employer INN; removed for sole proprietors.
      - name: company_size
        description: companyBusinessSize.
        data_tests:
          - accepted_values:
              arguments:
                values: [MICRO, SMALL, MIDDLE, BIG, LARGE]
              config:
                severity: warn
      - name: region
        description: regionName.
      - name: region_code
        description: stateRegionCode (13 digits).
      - name: address
        description: vacancyAddress as stated.
      - name: salary_text
        description: Salary as the portal prints it ("от N").
      - name: salary_from
        description: salaryMin; null when absent or 0 ("not stated").
      - name: salary_to
        description: salaryMax; null when absent or 0. Often equal to salary_from (200 984 of 555 417 on 2026-07-01).
      - name: salary_currency
        description: Always null; the snapshot does not state a currency.
      - name: salary_currency_code
        description: >
          RUB when an amount is present: the snapshot does not repeat the currency, while the API of
          the same portal states «руб.» on every record (11 632 of 11 632 on 2026-10-08).
        data_tests:
          - accepted_values:
              arguments:
                values: [RUB]
      - name: schedule
        description: scheduleType.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Полный рабочий день
                  - Неполный рабочий день/неполная рабочая неделя
                  - Сменная работа
                  - Ненормированный рабочий день
                  - Режим гибкого рабочего времени
                  - Вахтовый метод
              config:
                severity: warn
      - name: employment
        description: busyType; empty in the source becomes null.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Полная занятость
                  - Частичная занятость
                  - Временная работа
                  - Сезонная работа
                  - Стажировка
                  - Дистанционная (удаленная) работа
              config:
                severity: warn
      - name: experience_min_years
        description: experienceRequirements, years as stated (a minimum; a few values up to 60 are kept as stated).
      - name: education
        description: educationRequirements.educationType.
      - name: sphere_code
        description: codeProfessionalSphere (35 values in the portal dictionary).
        data_tests:
          - accepted_values:
              arguments:
                values: [Medicine, Education, Sales, Industry, Communal, Transport, Agricultural,
                  NotQualification, WorkingSpecialties, Restaurants, BuldindRealty, ElectricpowerIndustry,
                  StateServices, Safety, Food, Culture, MechanicalEngineering, DeskWork, Resources,
                  Management, Forest, AccountingTaxesManagement, InformationTechnology, ServiceMaintenance,
                  Metallurgy, ChemicalAndFuelIndustry, Jurisprudence, RootLightIndustry,
                  SportsFitnessBeautySalons, Finances, HumanRecruitment, Consulting, Marketing,
                  HomePersonal, Entertainment]
              config:
                severity: warn
      - name: sphere_name
        description: professionalSphereName.
      - name: profession_code
        description: codeProfession; one typical position spans many codes ("Программист" 30 on 2026-07-01).
      - name: typical_position
        description: typicalPosition of the portal's profession classifier.
      - name: source_type
        description: sourceType; reposts from commercial sites are "Вакансия интернет ресурса".
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Вакансия работодателя
                  - Вакансия интернет ресурса
                  - Вакансия кадрового агентства
                  - Цифровой хаб
                  - Аккредитованное частное агентство занятости
              config:
                severity: warn
      - name: status
        description: Moderation status at the portal.
        data_tests:
          - accepted_values:
              arguments:
                values: [Одобрено, Не опубликовано, Ожидает подтверждения, Не одобрено]
              config:
                severity: warn
      - name: is_deleted
        description: deleted flag of the snapshot record.
        data_tests: [not_null]
      - name: work_places
        description: Number of open positions.
      - name: date_published
        description: datePublished, UTC.
      - name: change_time
        description: changeTime, UTC.
      - name: skills
        description: Skills listed by the employer.
      - name: snapshot_version
        description: Version stamp of the snapshot file (YYYYMMDDTHHMMSS).
      - name: is_it_candidate
        description: *it_rule
        data_tests: [not_null]
      - name: ingested_at
        description: When the chosen raw row reached ClickHouse; drives which days a build takes again.
        data_tests: [not_null]

  - name: stg_habr
    description: >
      Habr Career, one row per vacancy per raw day (source_id, dt). A rerun on the same day can write
      a second raw row (32 of 1 069 on 2026-10-08); the latest fetched_at wins, then the latest
      card_fetched_at. The list has no description; text comes from the card page and is carried
      from the last card read when the list entry did not change.
    data_tests:
      - unique_combination:
          arguments:
            columns: [source_id, dt]
    columns:
      - name: source
        description: Always habr here.
        data_tests: [not_null]
      - name: source_id
        description: Habr vacancy id.
        data_tests: [not_null]
      - name: dt
        description: Moscow day of the run.
        data_tests: [not_null]
      - name: content_hash
        description: Hash of what the record says; with source, source_id and dt it is the key of the raw row.
        data_tests: [not_null]
      - name: fetched_at
        description: When the list page with this vacancy was requested (UTC).
        data_tests: [not_null]
      - name: published_at
        description: datePosted of the card's JSON-LD, UTC; null without a card.
      - name: has_future_published_at
        description: >
          published_at is later than fetched_at. Habr sometimes states a datePosted ahead of the day
          the card was read (2 of 519 cards on 2026-10-08); kept and flagged, not dropped.
        data_tests: [not_null]
      - name: modified_at
        description: Always null; Habr gives no modification date.
      - name: url
        description: Vacancy page.
      - name: title
        description: Job title.
        data_tests: [not_null]
      - name: text
        description: Card description as plain text after PII removal; null until the card is read.
      - name: has_text
        description: text is present and not blank.
        data_tests: [not_null]
      - name: card_fetched_at
        description: When the card page behind text was read (UTC).
      - name: has_card
        description: A card has been read for this vacancy.
        data_tests: [not_null]
      - name: employer_name
        description: Company title; "ИП" for a sole proprietor.
      - name: employer_id
        description: Habr company id.
      - name: employer_alias
        description: Habr company alias (URL slug).
      - name: cities
        description: Location titles from the list entry.
      - name: salary_text
        description: Salary as Habr prints it; null when not stated.
      - name: salary_from
        description: Lower bound stated by the employer.
      - name: salary_to
        description: Upper bound stated by the employer.
      - name: salary_currency
        description: Currency as Habr writes it.
        data_tests:
          - accepted_values:
              arguments:
                values: [rur, usd, eur]
      - name: salary_currency_code
        description: ISO code of salary_currency.
        data_tests:
          - accepted_values:
              arguments:
                values: [RUB, USD, EUR]
      - name: predicted_salary_from
        description: Habr's own salary estimate, not stated by the employer; never mix with salary_from.
      - name: predicted_salary_to
        description: Upper bound of Habr's estimate.
      - name: predicted_salary_currency
        description: Currency of Habr's estimate.
        data_tests:
          - accepted_values:
              arguments:
                values: [rur]
              config:
                severity: warn
      - name: employment
        description: Employment from the list entry.
        data_tests:
          - accepted_values:
              arguments:
                values: [full_time, part_time]
              config:
                severity: warn
      - name: card_employment_type
        description: employmentType of the card's JSON-LD.
        data_tests:
          - accepted_values:
              arguments:
                values: [FULL_TIME, PART_TIME]
              config:
                severity: warn
      - name: remote_work
        description: remoteWork flag of the list entry.
      - name: job_location_type
        description: jobLocationType of the card's JSON-LD (TELECOMMUTE for remote).
        data_tests:
          - accepted_values:
              arguments:
                values: [TELECOMMUTE]
              config:
                severity: warn
      - name: grade
        description: Qualification stated by the employer, lowercased.
        data_tests:
          - accepted_values:
              arguments:
                values: [intern, junior, middle, senior, lead]
      - name: divisions
        description: Specializations of the vacancy.
      - name: skills
        description: Skills tagged on the vacancy.
      - name: raised_at
        description: publishedDate of the list, the moment the vacancy was last raised; not its publication.
      - name: valid_through
        description: validThrough of the card's JSON-LD.
      - name: is_archived
        description: archived flag of the list entry.
        data_tests: [not_null]
      - name: collector_passes
        description: Which list walks (by date, by salary, by specialization group) returned the vacancy.
      - name: ingested_at
        description: When the chosen raw row reached ClickHouse; drives which days a build takes again.
        data_tests: [not_null]

  - name: stg_superjob
    description: >
      SuperJob, one row per vacancy per raw day (source_id, dt): a full snapshot of the API's IT slice
      every run (catalogue 33 plus title queries, radar.collect.superjob). A rerun on the same day can
      write a second raw row for a vacancy that changed in between; the latest fetched_at wins. Feeds
      stg_vacancies, the history (absence closes, see hist_calendar), the dedup units and the marts
      as a source family of its own. Texts stay local (DECISIONS 2).
    data_tests:
      - unique_combination:
          arguments:
            columns: [source_id, dt]
    columns:
      - name: source
        description: Always superjob here.
        data_tests: [not_null]
      - name: source_id
        description: SuperJob vacancy id.
        data_tests: [not_null]
      - name: dt
        description: Moscow day of the run.
        data_tests: [not_null]
      - name: content_hash
        description: Hash of what the record says; the raise date, viewer state and the employer profile are left out.
        data_tests: [not_null]
      - name: fetched_at
        description: When the search page with this vacancy was requested (UTC).
        data_tests: [not_null]
      - name: published_at
        description: >
          date_published, UTC. SuperJob moves it when the employer raises the vacancy, so it is the
          latest raise, not the first publication.
      - name: modified_at
        description: Always null; SuperJob gives no modification date.
      - name: url
        description: Vacancy page on superjob.ru.
      - name: title
        description: profession, the job title.
        data_tests: [not_null]
      - name: text
        description: vacancyRichText as plain text after PII removal (or duties, requirements and conditions when it is empty).
      - name: has_text
        description: text is present and not blank.
        data_tests: [not_null]
      - name: employer_name
        description: firm_name; "ИП" or a placeholder when the employer is a person.
      - name: employer_id
        description: SuperJob client id; null when the employer is a person.
      - name: town
        description: Town of the vacancy.
      - name: cities
        description: The town as a one-element list (empty without a town), the column of the union and the marts.
      - name: address_town_level
        description: Address cut to the region and settlement before the raw layer; street, house, coordinates and metro are not stored.
      - name: salary_from
        description: payment_from; 0 at the source means not stated and is null here.
      - name: salary_to
        description: payment_to; 0 at the source means not stated and is null here.
      - name: salary_currency
        description: Currency as SuperJob writes it.
      - name: salary_currency_code
        description: ISO code of salary_currency.
      - name: salary_by_agreement
        description: agreement, the salary is "by agreement".
      - name: experience
        description: Required experience as SuperJob names it.
      - name: experience_id
        description: SuperJob experience id (0 not important, 1 none, 2 from 1 year, 3 from 3 years, 4 from 6 years).
      - name: experience_min_years
        description: >
          Required years as a minimum: 0 for «Без опыта», 1, 3 and 6 for «От 1 года», «От 3 лет» and «От 6
          лет»; NULL for «Не имеет значения», which states no requirement.
      - name: type_of_work
        description: Employment type as SuperJob names it.
      - name: place_of_work
        description: Place of work as SuperJob names it.
      - name: place_of_work_id
        description: SuperJob place of work id (0 not important, 1 at the employer, 2 at home, 3 travelling).
      - name: remote_work
        description: >
          true for place_of_work 2 (work from home), false for 1 and 3, NULL for 0 «Не имеет значения»
          (784 of 787 on 2026-10-12), which says nothing about the format.
      - name: catalogue_ids
        description: Ids of the SuperJob catalogues (industries) the vacancy is filed under.
      - name: catalogue_positions
        description: Titles of the catalogue positions.
      - name: in_it_catalogue
        description: Filed under catalogue 33 "IT, Интернет, связь, телеком".
        data_tests: [not_null]
      - name: skills
        description: professionalSkills of the vacancy.
      - name: uploaded_to_trudvsem
        description: trud_vsem.is_uploded, SuperJob says it passed the vacancy on to trudvsem; a hint for the cross-source dedup.
      - name: published_until
        description: date_pub_to, UTC; the end of the current publication.
      - name: is_archived
        description: >
          is_archive or is_closed of the record; the search returned none on 2026-10-12 (0 of 787), so a
          closure is seen through absence (hist_calendar).
        data_tests: [not_null]
      - name: collector_queries
        description: Collector queries that found the vacancy (catalogue_33, title_<phrase>).
      - name: is_it_candidate
        description: >
          In catalogue 33 or the title matches the IT pattern of the trudvsem models (macro
          it_title_pattern). Recall first, like the trudvsem filter; not measured.
        data_tests: [not_null]
      - name: ingested_at
        description: When the chosen raw row reached ClickHouse; drives which days a build takes again.
        data_tests: [not_null]

  - name: stg_vacancies
    description: >
      All staging sources in one column set (a view over the per-source tables). Columns a source
      does not have are null or an empty array: region, schedule and source_type are trudvsem only;
      experience_min_years is trudvsem and SuperJob; cities and remote_work are Habr and SuperJob;
      grade is Habr only. Every Habr vacancy is an IT candidate. Row count equals the sum of the per-source models (singular test
      assert_stg_vacancies_rows_match_sources).
    columns:
      - name: source
        description: trudvsem, trudvsem_snapshot, habr or superjob.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [trudvsem, trudvsem_snapshot, habr, superjob]
      - name: source_id
        description: Vacancy id at the source.
        data_tests: [not_null]
      - name: dt
        description: Raw partition date.
        data_tests: [not_null]
      - name: content_hash
        description: Hash of what the record says; with source, source_id and dt it is the key of the raw row.
        data_tests: [not_null]
      - name: fetched_at
        description: When the record was requested (UTC).
      - name: published_at
        description: Publication at the source, UTC.
      - name: modified_at
        description: Last modification at the source, UTC; trudvsem only.
      - name: url
        description: Vacancy page.
      - name: title
        description: Job title.
      - name: text
        description: Vacancy text after PII removal; for the snapshot only on IT candidates.
      - name: has_text
        description: text is present and not blank.
      - name: employer_name
        description: Employer as named by the source.
      - name: region
        description: Region name (trudvsem).
      - name: cities
        description: Location titles (Habr), the town (SuperJob).
      - name: salary_text
        description: Salary as the source prints it.
      - name: salary_from
        description: Lower bound as stated; null when not stated.
      - name: salary_to
        description: Upper bound as stated; null when not stated.
      - name: salary_currency
        description: Currency as the source writes it.
      - name: salary_currency_code
        description: ISO code of the currency.
        data_tests:
          - accepted_values:
              arguments:
                values: [RUB, USD, EUR, KZT, BYN, UZS, CNY, GBP]
      - name: schedule
        description: Working schedule (trudvsem).
      - name: employment
        description: Employment type as the source names it (SuperJob type_of_work).
      - name: remote_work
        description: Remote flag (Habr; SuperJob place_of_work, NULL where it is «Не имеет значения»).
      - name: experience_min_years
        description: Required years of experience as a minimum (trudvsem; SuperJob from its experience id).
      - name: grade
        description: Qualification (Habr).
      - name: source_type
        description: Who posted it (trudvsem).
      - name: skills
        description: Skills listed or tagged at the source.
      - name: is_it_candidate
        description: Wide IT filter for trudvsem (see stg_trudvsem_snapshot) and SuperJob (see stg_superjob); always true for Habr.
        data_tests: [not_null]
      - name: ingested_at
        description: When the chosen raw row reached ClickHouse.

  - name: stg_telegram
    description: >
      Vacancy posts of the Telegram channels (raw is_vacancy by the rules of
      radar.collect.telegram_rules), one row per post: an edited post is collected again under a new
      content_hash and the latest fetch wins. For weekly aggregates only (DECISIONS 10): roles,
      grades, formats and skills come from rules and the dictionary, no model. Neither the text nor
      the first line is kept (DECISIONS 2). Cross-posts: the same normalized text (links, @names,
      hashtags, punctuation and emoji aside) published in the same week counts once, whichever
      channel carried it; the earliest copy is the one counted (is_week_duplicate false). The
      configs network groups explain most copies, but the data also has copies across networks and
      reposts inside one channel, so the week, not the network, is the dedup scope. A channel with
      a language in the seed (remoteit, Russian only since 2026-10-12) keeps only posts whose own text is
      in it (macro post_lang, the rule of radar.extract.telegram_corpus.post_lang); raw keeps all.
    data_tests:
      - unique_combination:
          arguments:
            columns: [source_id]
    columns:
      - name: source_id
        description: <channel>/<post id>.
        data_tests: [not_null]
      - name: channel
        description: Channel name.
        data_tests: [not_null]
      - name: network
        description: Publisher network of the channel (seed telegram_channels, from configs/telegram_channels.toml); the channel itself when it has none.
        data_tests: [not_null]
      - name: channel_topic
        description: Topic of the channel in the config (data, ml, general, ...).
      - name: dt
        description: Raw partition (Moscow day of the run that read the post).
      - name: fetched_at
        description: When the page with the post was read (UTC).
      - name: published_at
        description: Post date (UTC).
        data_tests: [not_null]
      - name: published_week
        description: Monday of the post's week, Moscow time.
        data_tests: [not_null]
      - name: is_multi_vacancy
        description: The rules counted several vacancies in the post; not split.
      - name: vacancies_in_post
        description: Vacancies the rules counted in the post.
      - name: links_to_habr
        description: >
          The post links a Habr Career vacancy. habr_career and progjob repost Habr Career; Telegram is
          never added to Habr counts, so this only measures the overlap.
      - name: text_hash
        description: cityHash64 of the normalized text (macro telegram_text_hash).
      - name: is_week_duplicate
        description: An earlier post of the same week has the same normalized text.
        data_tests: [not_null]
      - name: role_bucket
        description: >
          Role bucket of the first line that is not only hashtags, else of the hashtags, else of the
          first 300 characters; multi_post for multi-vacancy posts; not_it when nothing matches.
      - name: grade
        description: Grade named in the first line or the hashtags, lowest wins; unknown otherwise.
      - name: work_format
        description: office, hybrid, remote or unknown from phrases and hashtags of the text.
      - name: no_experience_stated
        description: The text says no experience is needed.
      - name: skills
        description: Dictionary skills found in the text, sorted.
      - name: ingested_at
        description: When the chosen raw row reached ClickHouse.
