name: radar
version: "1.0.0"
config-version: 2
profile: radar

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "logs"]

flags:
  send_anonymous_usage_stats: false
  use_colors: false

vars:
  # model_id of extract.vacancy_fields that int_vacancy_fields reads (radar.extract.corpus_run).
  # Empty keeps the models of models/extract off.
  extraction_model: "qwen3_1p7b_r16_clean-awq"

models:
  radar:
    staging:
      +schema: staging
      +materialized: view
    extract:
      +schema: staging
      +materialized: view

seeds:
  radar:
    +schema: staging
