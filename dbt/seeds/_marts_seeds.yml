version: 2

seeds:
  - name: skill_dictionary
    description: >
      Skill dictionary v0 for the marts: canonical skill, category and spellings, English
      and Russian, picked from what the trudvsem, Habr and Telegram texts and Habr skill tags of
      2026-10-08 obviously contain. Used for every source (marts and stg_telegram). The tuned dictionary replaces
      it with the normalized skill dictionary of the extraction schema; until then the
      skill counts are dictionary counts, with the false positives of short spellings in English
      text (go, rest, solid) included.
    config:
      column_types:
        skill: String
        category: String
        synonyms: String
    columns:
      - name: skill
        description: Canonical skill name, the key of mart_skills.
        data_tests: [unique, not_null]
      - name: category
        description: language, framework, frontend, mobile, database, data, bi, analytics, ml, devops, cloud, os, network, tools, testing, architecture, analysis, methodology, security, platform, design, gamedev, embedded, language_human, soft.
        data_tests: [not_null]
      - name: synonyms
        description: >
          Spellings separated by |, lowercase with ё written as е; each is an RE2 fragment matched
          between non-word characters (macro skill_dictionary_constant), so + and . are written as
          [+] and [.], and [а-я]* takes Russian endings. No negated class (Hyperscan shortlists by the
          bare synonyms and gets those wrong) and no | inside a group (radar.extract.skill_dictionary
          splits on every |). Words that are mostly something else are left out or bound to a
          context: «нода» (a cluster node), cv (a résumé), any «интеграци*» (only integration of
          systems and services), any mention of «ТЗ» (only writing one).
        data_tests: [not_null]

  - name: role_groups
    description: >
      Role buckets of the marts (macros/marts.sql, role_buckets) in five groups, the groups of the
      survival analysis (radar.models.survival ROLE_GROUPS, the gold-sample role proxy), kept equal to
      it by tests/dbt. The salary and lifetime marts total their rows by these groups.
    config:
      column_types:
        role_bucket: String
        role_group: String
    columns:
      - name: role_bucket
        description: Role bucket; every bucket except not_it and multi_post.
        data_tests: [unique, not_null]
      - name: role_group
        description: ml_ds_data, dev, analyst, qa_devops_sys or other_it.
        data_tests:
          - accepted_values:
              arguments:
                values: [ml_ds_data, dev, analyst, qa_devops_sys, other_it]

  - name: telegram_channels
    description: >
      Channels of configs/telegram_channels.toml with their publisher network and topic, for
      stg_telegram. A copy of the config, kept equal to it by tests/dbt (regenerate the CSV when the
      config changes).
    config:
      column_types:
        channel: String
        network: String
        topic: String
        enabled: Bool
        lang: String
    columns:
      - name: channel
        description: Channel name (t.me/s/<channel>).
        data_tests: [unique, not_null]
      - name: network
        description: Publisher network; empty when the channel has none.
      - name: topic
        description: Topic in the config.
      - name: enabled
        description: Collected daily.
      - name: lang
        description: >
          The one language the channel's posts count in (macro post_lang), empty when every post
          counts. stg_telegram drops the channel's posts in other languages; raw keeps them.
        data_tests:
          - accepted_values:
              arguments:
                values: ['', ru]

  - name: skill_dictionary_v1
    description: >
      Skill spellings mapped to the names of the skill dictionary v1, configs/skills.toml,
      for the marts on extracted fields, keyed by the hash of the lookup key (macros skill_key and
      skill_hash, the folding of radar.extract.skills.key). Origin dictionary: every name and alias,
      with the spelling. Origin corpus: every other spelling the extraction model wrote, resolved by
      radar.extract.skills.normalize_list, stored as the hash only (the spellings come from Habr and
      Telegram texts). One row per key and skill; a spelling that maps to several skills (a glued
      list such as C# and .NET) has several rows. Written by `python dbt/skill_seed.py` (reads
      ClickHouse); tests/dbt fails when the dictionary rows are stale, and
      assert_skill_seed_covers_extracted_spellings warns when the corpus has spellings the seed has
      not seen.
    config:
      column_types:
        key_hash: String
        spelling_key: String
        spelling: String
        skill: String
        category: String
        parent: String
        status: String
        origin: String
    data_tests:
      - unique_combination:
          arguments:
            columns: [key_hash, skill]
    columns:
      - name: key_hash
        description: First 16 hex digits of sha256 of the lookup key (lowercase, ё as е, no spaces, hyphens, underscores or dots).
        data_tests: [not_null]
      - name: spelling_key
        description: The lookup key; empty for corpus rows.
      - name: spelling
        description: The spelling as the dictionary lists it; empty for corpus rows.
      - name: skill
        description: Canonical skill name; empty for a non-skill or an unknown spelling.
      - name: category
        description: Category of the skill in configs/skills.toml.
      - name: parent
        description: Broader skill of [parents] (Ubuntu to Linux); empty when none.
      - name: status
        description: known (maps to the skill), non_skill (the annotation guide does not count it) or unknown (the dictionary lacks it).
        data_tests:
          - accepted_values:
              arguments:
                values: [known, non_skill, unknown]
      - name: origin
        description: dictionary (a name or alias) or corpus (a spelling the extraction model wrote).
        data_tests:
          - accepted_values:
              arguments:
                values: [dictionary, corpus]
